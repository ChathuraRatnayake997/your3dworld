<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03060a" />
  <meta name="description" content="Planet Forge — generate a seeded procedural 3D planet with terrain, clouds, atmosphere, and a starfield. Drag to orbit, zoom, and share the seed." />
  <title>Planet Forge — Procedural Planet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2304070c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%238fd8ff'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5.5' fill='none' stroke='%23ffcf8a' stroke-width='1.6' transform='rotate(-18 16 16)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=39" />
</head>
<body>
  <canvas id="scene" aria-label="Interactive 3D procedural planet. Drag to rotate, scroll to zoom, double-click to reset the view."></canvas>
  <div class="atmo-glow" id="atmoGlow" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="ui">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Planet Forge home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="6.5" fill="currentColor" />
            <ellipse cx="16" cy="16" rx="14" ry="5.4" stroke="currentColor" stroke-width="1.4" transform="rotate(-18 16 16)" opacity=".72" />
            <circle cx="27.6" cy="9.6" r="1.6" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>PLANET FORGE</strong>
          <small>PROCEDURAL WORLD ENGINE</small>
        </span>
      </a>

      <div class="seed-panel" role="group" aria-label="Planet seed">
        <label class="seed-label" for="seedInput">SEED</label>
        <input id="seedInput" class="seed-input" type="text" value="ORION-7" maxlength="24" spellcheck="false" autocomplete="off" aria-label="Planet seed" />
        <button id="randomBtn" class="generate-btn" type="button" title="Generate a new planet" aria-label="Generate a new planet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="4" />
            <circle cx="9" cy="9" r="1.1" fill="currentColor" stroke="none" />
            <circle cx="15" cy="9" r="1.1" fill="currentColor" stroke="none" />
            <circle cx="9" cy="15" r="1.1" fill="currentColor" stroke="none" />
            <circle cx="15" cy="15" r="1.1" fill="currentColor" stroke="none" />
          </svg>
          <span>Generate</span>
        </button>
      </div>
    </header>

    <div class="hud-left">
      <div class="controls-hint" aria-hidden="true">
        <span><b>Drag</b> orbit</span>
        <span><b>Scroll</b> zoom</span>
        <span><b>Double-click</b> reset</span>
      </div>
      <button id="resetViewBtn" class="ghost-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.5-5.8" />
          <path d="M4 4v5h5" />
        </svg>
        Reset view
      </button>
    </div>

    <aside class="stats" aria-live="polite">
      <div class="stats-head">
        <span class="stats-title">WORLD SURVEY</span>
        <span class="seed-tag" id="seedTag">ORION-7</span>
      </div>
      <div class="stat-grid">
        <div class="stat"><span>CLASS</span><strong id="statClass">—</strong></div>
        <div class="stat"><span>OCEAN</span><strong id="statOcean">—</strong></div>
        <div class="stat"><span>CLOUDS</span><strong id="statClouds">—</strong></div>
        <div class="stat"><span>ICE</span><strong id="statIce">—</strong></div>
        <div class="stat"><span>MOONS</span><strong id="statMoons">—</strong></div>
        <div class="stat"><span>RINGS</span><strong id="statRings">—</strong></div>
      </div>
      <p class="system-line" id="statSystem">—</p>
      <button id="copyBtn" class="copy-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1" />
          <path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1" />
        </svg>
        Copy share link
      </button>
      <button id="captureBtn" class="copy-btn capture-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8h3l1.5-2h7L17 8h3v11H4z" />
          <circle cx="12" cy="13" r="3.2" />
        </svg>
        Capture image
      </button>
    </aside>
  </main>

  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-ring"><span></span></div>
    <p class="loader-title" id="loaderTitle">Forging world</p>
    <p class="loader-progress" id="loaderProgress">0%</p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js?v=39"></script>
</body>
</html>
